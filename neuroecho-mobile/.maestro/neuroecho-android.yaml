# Maestro flow for the NeuroEcho Expo / React Native Android app.

appId: host.exp.exponent
name: NeuroEcho — Android end-to-end smoke
tags:
  - smoke
  - android
  - react-native
  - neuroecho

---

# ---------------------------------------------------------------------------
# 0. Pre-grant OS runtime permissions before the app is touched.
# ---------------------------------------------------------------------------

- runFlow: flows/permissions.yaml

# ---------------------------------------------------------------------------
# 1. Launch & verify the Hub tab loads with its hero copy + 4 game tiles.
# ---------------------------------------------------------------------------

- launchApp:
    clearState: true
    appId: host.exp.exponent
    permissions:
      android.permission.CAMERA: allow
      android.permission.RECORD_AUDIO: allow

# The Hub is the default tab on cold launch.
- assertVisible: "NeuroEcho"
- assertVisible: "Welcome to NeuroEcho"
- assertVisible: "Pick a game below, or tap the microphone and Echo will help you."
- assertVisible: "Your Cognitive Index"
- assertVisible: "AI Insight"

- assertVisible: "Spot the AI Lie"
- assertVisible: "Era Guesser"
- assertVisible: "Recipe Rebuilder"
- assertVisible: "Motion Match"

# ---------------------------------------------------------------------------
# 2. Tap into every game and verify the per-game screen loads, then back out.
#    Added waitForAnimationToEnd to let React Navigation transitions finish.
# ---------------------------------------------------------------------------

- tapOn: "Spot the AI Lie"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Spot the AI Lie"
- assertVisible: "Reset audio"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Welcome to NeuroEcho"

- tapOn: "Era Guesser"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Era Guesser"
- assertVisible: "Which item is anachronistic and doesn't belong in the"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Welcome to NeuroEcho"

- tapOn: "Recipe Rebuilder"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Recipe Rebuilder"
- assertVisible: "Reshuffle steps"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Welcome to NeuroEcho"

- tapOn: "Motion Match"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Motion Match"
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Welcome to NeuroEcho"

# ---------------------------------------------------------------------------
# 3. Analytics tab — domain breakdown renders.
# ---------------------------------------------------------------------------

- tapOn: "Analytics"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Cognitive Analytics"
- assertVisible: "Cognitive Analytics & Progress"
- assertVisible: "Overall NeuroEcho Index"
- assertVisible: "Cognitive Domain Breakdown"
- assertVisible: "1. Spot the AI Lie (Auditory Memory)"
- assertVisible: "2. Era Guesser (Visual Semantic)"
- assertVisible: "3. Recipe Rebuilder (Executive Sequencing)"
- assertVisible: "4. Motion Match (Dual-Task Motor)"

# ---------------------------------------------------------------------------
# 4. Settings tab — theme, language, tremor, speech, voice, difficulty, save.
# ---------------------------------------------------------------------------

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Zen Settings"
- assertVisible: "Zen Settings & Tremor Adaptation"

# 4a. Switch to Dark theme.
- tapOn: "Dark"
- assertVisible: "Dark"

# 4b. Switch the UI language to Hindi.
- tapOn: "हिन्दी"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "होम"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "न्यूरोइको में आपका स्वागत है"

# 4c. Flip back to English BEFORE the rest of the flow.
- tapOn: "सेटिंग्स"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "English"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Hub"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Welcome to NeuroEcho"

# 4d. Push the rest of the toggles in one shot.
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Voice Synthesis Pace"

- tapOn: "Active"
- assertVisible: "Disabled"

- tapOn: "Slow & Clear (0.75x)"
- assertVisible: "Maximum auditory clarity"

- tapOn: "Phone Speaker"

- tapOn: "Gentle Zen"
- assertVisible: "Longer pauses & simpler questions"

- tapOn: "Save"
- assertVisible: "Settings Saved!"

# ---------------------------------------------------------------------------
# 5. AI Assistant modal
# ---------------------------------------------------------------------------

- assertVisible: "Ask NeuroEcho AI"
- tapOn: "Ask NeuroEcho AI"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "NeuroEcho AI Assistant"
- assertVisible: "Ask Cognitive questions or request a custom game topic"

- inputText: "How can I improve my memory?"
- tapOn: "Ask AI"

# Explicitly wait for the dynamic network response from the AI backend
- extendedWaitUntil:
    visible: "NeuroEcho Cognitive Answer"
    timeout: 10000

- tapOn: "Close AI assistant"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Welcome to NeuroEcho"

# ---------------------------------------------------------------------------
# 6. AI Companion floating action button
# ---------------------------------------------------------------------------

- tapOn: "Talk to Echo, your AI companion"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Talk to Echo"
- assertVisible: "Tap the microphone and speak"

- tapOn: "Close"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Welcome to NeuroEcho"

# ---------------------------------------------------------------------------
# 7. Reset the theme back to Light.
# ---------------------------------------------------------------------------

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Light"