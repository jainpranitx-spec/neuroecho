name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Deploy only runs after the backend CI job passes on main — never ship a
  # build that failed typecheck, lint, migrations, or the build itself.
  # (Only gated on the "backend" CI job — the "mobile" CI job builds a
  # separate app that isn't deployed by this workflow.)
  # This job never checks out the repo (it only polls the CI check via the
  # GitHub API), so it must NOT inherit a working-directory default — doing
  # so made even this job's own abort step fail with "No such file or
  # directory" before it could report the real CI failure.
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: wait-for-ci
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: backend
          ref: ${{ github.sha }}
      - name: Fail if CI did not succeed
        if: steps.wait-for-ci.outputs.conclusion != 'success'
        run: |
          echo "CI did not succeed (conclusion: ${{ steps.wait-for-ci.outputs.conclusion }}) — aborting deploy."
          exit 1

  deploy:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: neuroecho-cognitive-arcade-prototype-v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
