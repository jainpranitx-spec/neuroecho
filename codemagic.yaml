workflows:
  android-debug:
    name: Android Debug (unsigned, no credentials)
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: neuroecho-mobile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: latest
          include: true
    environment:
      node: 22
      vars:
        # Points the app at your deployed backend. Swap for your real
        # Vercel URL (or leave as-is to fall back to localhost, which
        # won't work from a real device/emulator anyway during testing).
        EXPO_PUBLIC_API_URL: https://neuroecho.vercel.app
    cache:
      cache_paths:
        - node_modules
        - $HOME/.gradle/caches
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Prebuild native Android project
        script: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - neuroecho-mobile/android/app/build/outputs/**/*.apk

  ios-simulator:
    name: iOS Simulator Build (unsigned, no credentials)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: neuroecho-mobile
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: latest
          include: true
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        EXPO_PUBLIC_API_URL: https://neuroecho.vercel.app
    cache:
      cache_paths:
        - node_modules
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Prebuild native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build for iOS Simulator
        script: |
          cd ios
          WORKSPACE=$(ls | grep .xcworkspace | head -1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e "const d=JSON.parse(require('fs').readFileSync(0));console.log(d.workspace.schemes[0])")
          echo "Building $SCHEME from $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - neuroecho-mobile/build/Build/Products/Debug-iphonesimulator/*.app
